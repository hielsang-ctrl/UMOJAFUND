services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: umoja
      POSTGRES_USER: umoja
      POSTGRES_PASSWORD: umoja
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umoja"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://umoja:umoja@db:5432/umoja
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"

  # Settles M-Pesa payments whose callback never arrived (safety net, runs every 2 minutes)
  reconcile:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://umoja:umoja@db:5432/umoja
    depends_on:
      - web
    command: >
      sh -c "while true; do python manage.py reconcile_mpesa; sleep 120; done"

volumes:
  pgdata:
  media:
